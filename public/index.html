<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>env-drift Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --danger: #f87171;
      --warning: #fbbf24;
      --info: #a78bfa;
      --success: #34d399;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .links a {
      color: var(--primary);
      text-decoration: none;
      margin: 0 10px;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 680px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
    .editor-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .editor-card label {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: var(--primary);
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0b1120;
      color: #e2e8f0;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .actions {
      text-align: center;
      margin-bottom: 24px;
    }
    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--primary-hover);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .results {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: none;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .status-badge.sync {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status-badge.drift {
      background: rgba(248, 113, 113, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .cat-box {
      background: #0b1120;
      border-radius: 6px;
      padding: 12px;
      border-top: 3px solid var(--border);
    }
    .cat-box.missing {
      border-top-color: var(--danger);
    }
    .cat-box.empty {
      border-top-color: var(--warning);
    }
    .cat-box.extra {
      border-top-color: var(--info);
    }
    .cat-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .cat-title span.count {
      opacity: 0.8;
      font-weight: normal;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      padding: 4px 8px;
      margin-bottom: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
    }
    .empty-note {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>env-drift Demo</h1>
      <p>Identify missing, empty, and extra environment variables between .env.example and .env</p>
      <div class="links">
        <a href="https://www.npmjs.com/package/@gyraptor/env-drift" target="_blank" rel="noopener">NPM: @gyraptor/env-drift</a>
        &bull;
        <a href="https://github.com/GYRaptor/env-drift" target="_blank" rel="noopener">GitHub: GYRaptor/env-drift</a>
      </div>
    </header>

    <div class="grid">
      <div class="editor-card">
        <label for="exampleInput">.env.example</label>
        <textarea id="exampleInput">PORT=3000
DB_URL=postgres://user:pass@localhost:5432/mydb
API_KEY=your_api_key_here
STRIPE_KEY=sk_test_placeholder</textarea>
      </div>
      <div class="editor-card">
        <label for="envInput">.env</label>
        <textarea id="envInput">PORT=8080
API_KEY=
DEBUG=true</textarea>
      </div>
    </div>

    <div class="actions">
      <button id="checkBtn">Check drift</button>
    </div>

    <div id="results" class="results">
      <div id="statusBadge" class="status-badge"></div>
      <div class="categories">
        <div class="cat-box missing">
          <div class="cat-title">
            <span>Missing in .env</span>
            <span id="missingCount" class="count">(0)</span>
          </div>
          <ul id="missingList"></ul>
        </div>
        <div class="cat-box empty">
          <div class="cat-title">
            <span>Empty in .env</span>
            <span id="emptyCount" class="count">(0)</span>
          </div>
          <ul id="emptyList"></ul>
        </div>
        <div class="cat-box extra">
          <div class="cat-title">
            <span>Extra in .env</span>
            <span id="extraCount" class="count">(0)</span>
          </div>
          <ul id="extraList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    const checkBtn = document.getElementById('checkBtn');
    const exampleInput = document.getElementById('exampleInput');
    const envInput = document.getElementById('envInput');
    const results = document.getElementById('results');
    const statusBadge = document.getElementById('statusBadge');
    const missingList = document.getElementById('missingList');
    const emptyList = document.getElementById('emptyList');
    const extraList = document.getElementById('extraList');
    const missingCount = document.getElementById('missingCount');
    const emptyCount = document.getElementById('emptyCount');
    const extraCount = document.getElementById('extraCount');

    function renderList(ul, countEl, items) {
      countEl.textContent = `(${items.length})`;
      ul.innerHTML = '';
      if (items.length === 0) {
        ul.innerHTML = '<li class="empty-note">None</li>';
        return;
      }
      items.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item;
        ul.appendChild(li);
      });
    }

    async function checkDrift() {
      checkBtn.disabled = true;
      checkBtn.textContent = 'Checking...';
      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            example: exampleInput.value,
            env: envInput.value
          })
        });

        if (!res.ok) {
          throw new Error(`Server returned ${res.status}`);
        }

        const data = await res.json();
        results.style.display = 'block';

        if (data.ok) {
          statusBadge.textContent = '✓ In sync';
          statusBadge.className = 'status-badge sync';
        } else {
          statusBadge.textContent = '⚠ Drift detected';
          statusBadge.className = 'status-badge drift';
        }

        renderList(missingList, missingCount, data.missing || []);
        renderList(emptyList, emptyCount, data.empty || []);
        renderList(extraList, extraCount, data.extra || []);
      } catch (err) {
        alert('Failed to check drift: ' + err.message);
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Check drift';
      }
    }

    checkBtn.addEventListener('click', checkDrift);
  </script>
</body>
</html>
